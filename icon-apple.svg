<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1a6349"/>
      <stop offset="0.55" stop-color="#124c38"/>
      <stop offset="1" stop-color="#0b3527"/>
    </linearGradient>
    <linearGradient id="coverL" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#7e848c"/>
      <stop offset="1" stop-color="#4e545c"/>
    </linearGradient>
    <linearGradient id="coverR" x1="1" y1="0" x2="0" y2="0.4">
      <stop offset="0" stop-color="#9aa0a8"/>
      <stop offset="1" stop-color="#5c626a"/>
    </linearGradient>
    <linearGradient id="edgeL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f4"/>
      <stop offset="0.5" stop-color="#c9cfd6"/>
      <stop offset="1" stop-color="#9ea5ad"/>
    </linearGradient>
    <linearGradient id="edgeR" x1="0" y1="0" x2="0" y2="1">
