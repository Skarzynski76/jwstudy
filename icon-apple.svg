  <rect x="0" y="0" width="1024" height="1024" rx="0" fill="url(#bg)"/>
  <rect x="24" y="24" width="976" height="976" rx="0" fill="none" stroke="#8b9199" stroke-width="14"/>

  <ellipse cx="512" cy="782" rx="300" ry="40" fill="#000" opacity="0.28"/>

  <!-- SZARA OKŁADKA (bryła, wystaje spod kartek) -->
  <path d="M496 316 C 392 250, 268 244, 168 292 L 168 736 C 268 690, 392 700, 496 762 Z" fill="url(#coverL)" stroke="#3f454d" stroke-width="5"/>
  <path d="M528 316 C 632 250, 756 244, 856 292 L 856 736 C 756 690, 632 700, 528 762 Z" fill="url(#coverR)" stroke="#3f454d" stroke-width="5"/>

  <!-- SREBRNE BRZEGI KARTEK -->
  <path d="M500 344 C 402 288, 288 282, 196 322 L 196 716 C 288 678, 402 686, 500 740 Z" fill="url(#edgeL)"/>
  <path d="M524 344 C 622 288, 736 282, 828 322 L 828 716 C 736 678, 622 686, 524 740 Z" fill="url(#edgeR)"/>
  <g stroke="#a4abb3" stroke-width="2.5" opacity="0.5" fill="none">
    <path d="M232 330 L 232 706"/><path d="M270 318 L 270 700"/>
    <path d="M754 318 L 754 700"/><path d="M792 330 L 792 706"/>
  </g>

  <!-- KARTKI -->
  <path d="M502 362 C 408 308, 300 302, 214 340 L 214 700 C 300 664, 408 672, 502 722 Z" fill="url(#pageL)" stroke="#d8d2c3" stroke-width="3"/>
  <path d="M522 362 C 616 308, 724 302, 810 340 L 810 700 C 724 664, 616 672, 522 722 Z" fill="url(#pageR)" stroke="#d8d2c3" stroke-width="3"/>

  <!-- linie tekstu -->
  <g fill="none" stroke="#b8b09b" stroke-width="17" stroke-linecap="round" opacity="0.85">
    <path d="M276 424 C 340 414, 408 424, 456 448"/>
    <path d="M270 494 C 336 484, 406 494, 456 518"/>
    <path d="M266 564 C 334 554, 404 564, 456 588"/>
    <path d="M264 634 C 332 624, 402 634, 456 658"/>
    <path d="M748 424 C 684 414, 616 424, 568 448"/>
    <path d="M754 494 C 688 484, 618 494, 568 518"/>
    <path d="M758 564 C 690 554, 620 564, 568 588"/>
    <path d="M760 634 C 692 624, 622 634, 568 658"/>
