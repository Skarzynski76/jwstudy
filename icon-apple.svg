  <!-- grzbiet -->
  <path d="M502 362 L 502 722 C 508 736, 516 736, 522 722 L 522 362 C 516 352, 508 352, 502 362 Z" fill="#c8c1af"/>

  <!-- SREBRNA ZAKŁADKA — wstążka włożona między kartki prawej strony -->
  <path d="M636 336 L 706 316 L 706 606 L 671 558 L 636 612 Z" fill="url(#ribbon)" stroke="#7f858d" stroke-width="4" stroke-linejoin="round"/>
  <path d="M636 336 L 654 331 L 654 586 L 636 612 Z" fill="#ffffff" opacity="0.25"/>
